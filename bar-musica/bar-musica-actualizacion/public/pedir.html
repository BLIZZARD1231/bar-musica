<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pide tu cancion</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #121212; color: #fff; }
  header { padding: 16px; background: #1e1e2f; position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 12px; font-size: 16px; border-radius: 8px; border: 0; }
  button { padding: 12px 16px; font-size: 16px; border: 0; border-radius: 8px; background: #e91e63; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  main { padding: 12px 16px 80px; }
  .now { background: #26263a; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
  .item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a2a2a; }
  .item img { width: 96px; height: 54px; object-fit: cover; border-radius: 6px; background: #333; }
  .item .t { flex: 1; font-size: 14px; line-height: 1.25; }
  .item .t small { color: #999; display: block; }
  h2 { font-size: 15px; color: #bbb; margin: 18px 0 6px; }
  #msg { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 12px; border-radius: 10px; background: #333; text-align: center; display: none; z-index: 5; }
  #msg.ok { background: #2e7d32; } #msg.err { background: #c62828; }
</style>
</head>
<body>
<header>
  <h1>🎵 Pide tu cancion</h1>
  <form id="f">
    <input id="q" placeholder="Cancion o artista" autocomplete="off" required>
    <button>Buscar</button>
  </form>
</header>
<main>
  <div class="now" id="now">Cargando...</div>
  <div id="results"></div>
  <h2>En cola</h2>
  <div id="queue"></div>
</main>
<div id="msg"></div>

<script>
const $ = id => document.getElementById(id);
let msgTimer;
// Identificador propio de este celular (para el limite de pedidos por persona)
let cid = '';
try { cid = localStorage.getItem('cid') || ''; } catch (e) {}
if (!cid) {
  cid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : (Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2));
  try { localStorage.setItem('cid', cid); } catch (e) {}
}
function toast(text, ok) {
  const m = $('msg');
  m.textContent = text; m.className = ok ? 'ok' : 'err'; m.style.display = 'block';
  clearTimeout(msgTimer); msgTimer = setTimeout(() => m.style.display = 'none', 3500);
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

$('f').onsubmit = async (e) => {
  e.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  $('results').innerHTML = '<p>Buscando...</p>';
  try {
    const r = await fetch('/api/search?q=' + encodeURIComponent(q));
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    if (!data.length) { $('results').innerHTML = '<p>Sin resultados.</p>'; return; }
    $('results').innerHTML = data.map((v, i) => `
      <div class="item">
        <img src="${esc(v.thumb)}" alt="">
        <div class="t">${esc(v.title)}<small>${esc(v.author || '')} · ${esc(v.duration)}</small></div>
        <button data-i="${i}">Pedir</button>
      </div>`).join('');
    $('results').querySelectorAll('button').forEach(b => {
      b.onclick = () => pedir(data[b.dataset.i], b);
    });
  } catch (err) {
    $('results').innerHTML = '';
    toast(err.message, false);
  }
};

async function pedir(v, btn) {
  btn.disabled = true;
  try {
    const r = await fetch('/api/queue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-cid': cid },
      body: JSON.stringify({ id: v.id, title: v.title, thumb: v.thumb })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'No se pudo agregar');
    toast('¡Agregada a la cola!', true);
    $('results').innerHTML = '';
    $('q').value = '';
    refresh();
  } catch (err) {
    toast(err.message, false);
    btn.disabled = false;
  }
}

async function refresh() {
  try {
    const s = await (await fetch('/api/state')).json();
    $('now').textContent = s.current ? '▶ Sonando: ' + s.current.title : 'No suena nada: ¡pide la primera!';
    $('queue').innerHTML = s.queue.length
      ? s.queue.map((x, i) => `<div class="item"><img src="${esc(x.thumb)}" alt=""><div class="t">${i + 1}. ${esc(x.title)}</div></div>`).join('')
      : '<p style="color:#888">Cola vacia</p>';
  } catch (e) {}
}
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
