<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reproductor del bar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  #player { position: fixed; inset: 0; width: 100%; height: 100%; }
  #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; gap: 16px; }
  #start button { font-size: 28px; padding: 18px 40px; border: 0; border-radius: 12px; background: #e91e63; color: #fff; cursor: pointer; }
  #start p { max-width: 520px; text-align: center; color: #bbb; }
  #idle { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1b1b2f, #000); text-align: center; gap: 12px; }
  #idle img { width: 280px; height: 280px; background: #fff; padding: 12px; border-radius: 16px; }
  #idle h1 { font-size: 40px; margin: 8px 0 0; }
  #idle p { font-size: 22px; color: #ccc; margin: 0; }
  #np { position: fixed; left: 16px; bottom: 16px; z-index: 6; background: rgba(0,0,0,.6); padding: 8px 14px; border-radius: 10px; font-size: 16px; display: none; max-width: 70%; }
  #qrmini { position: fixed; right: 16px; bottom: 16px; z-index: 6; background: #fff; padding: 6px; border-radius: 10px; width: 110px; text-align: center; color: #000; font-size: 12px; display: none; }
  #qrmini img { width: 100%; display: block; }
</style>
</head>
<body>
<div id="start">
  <h1>Musica del bar</h1>
  <p>Inicia sesion en YouTube Premium en este navegador antes de empezar (sin anuncios). Luego toca el boton, pon el navegador en pantalla completa (F11) y listo.</p>
  <button id="startBtn">Iniciar</button>
</div>
<div id="idle">
  <img src="/api/qr.svg" alt="QR">
  <h1>Pide tu cancion</h1>
  <p>Escanea el QR con tu celular</p>
</div>
<div id="player"></div>
<div id="np"></div>
<div id="qrmini"><img src="/api/qr.svg" alt="QR"><div>Pide tu cancion</div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let yt = null, ytReady = false, started = false;
let mySeq = -1;
let playingSeq = -1;

function onYouTubeIframeAPIReady() {
  yt = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: () => { ytReady = true; },
      onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) finished(); },
      onError: () => { finished(); } // video no embebible o no disponible: pasa al siguiente
    }
  });
}

document.getElementById('startBtn').onclick = () => {
  started = true;
  document.getElementById('start').style.display = 'none';
  poll();
};

async function finished() {
  try {
    await fetch('/api/advance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seq: playingSeq })
    });
  } catch (e) {}
  poll();
}

async function poll() {
  if (!started || !ytReady) return;
  try {
    const s = await (await fetch('/api/state')).json();
    if (s.seq !== mySeq) {
      mySeq = s.seq;
      playingSeq = s.seq;
      if (s.current) {
        yt.loadVideoById(s.current.id);
      } else {
        yt.stopVideo();
      }
    }
    const idle = !s.current;
    document.getElementById('idle').style.display = idle ? 'flex' : 'none';
    document.getElementById('qrmini').style.display = idle ? 'none' : 'block';
    const np = document.getElementById('np');
    if (s.current) {
      np.style.display = 'block';
      np.textContent = '♪ ' + s.current.title + (s.queue.length ? '  ·  en cola: ' + s.queue.length : '');
    } else {
      np.style.display = 'none';
    }
  } catch (e) { /* servidor no disponible: reintenta */ }
}

setInterval(poll, 2000);

// Si cambia la direccion publica (tunel), refresca los QR
let lastUrl = '';
async function refreshQr() {
  try {
    const i = await (await fetch('/api/info')).json();
    if (i.url !== lastUrl) {
      lastUrl = i.url;
      document.querySelectorAll('img[src^="/api/qr.svg"]').forEach(img => img.src = '/api/qr.svg?t=' + Date.now());
    }
  } catch (e) {}
}
refreshQr();
setInterval(refreshQr, 5000);
</script>
</body>
</html>
